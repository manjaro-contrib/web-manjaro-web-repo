<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Manjaro Repository - Status of mirrors</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta http-equiv="refresh" content="300">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link href="../data/css/style.min.css" rel="stylesheet">
    <link rel="icon" href="../data/img/manjaro.png">
</head>
<body class="no-js">
<script>
    var _paq = window._paq = window._paq || [];
    _paq.push(['trackPageView']);
    _paq.push(['enableLinkTracking']);
    (function() {
      var u="https://matomo.manjaro.org/";
      _paq.push(['setTrackerUrl', u+'matomo.php']);
      _paq.push(['setSiteId', '5']);
      var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
      g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
    })();
  </script>  
    <nav class="navbar navbar-expand-md navbar-light bg-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="">
                <img src="../data/img/manjaro.png" width="30" height="30" class="d-inline-block align-top" alt="">
                Manjaro Repository
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="">Status of mirrors <span class="sr-only">(current)</span></a>
                    </li>
                </ul>
                <ul class="navbar-nav pull-xs-right">
                    <li class="nav-item">
                        <span class="navbar-text">Generated on $DATE</span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container template">
        <div id="filters">
            <div class="form-inline">
                <div class="custom-control custom-checkbox">
                    <input type="checkbox" class="custom-control-input" id="http-filter" checked>
                    <label class="custom-control-label" for="http-filter">HTTP</label>
                </div>
                <div class="custom-control custom-checkbox">
                    <input type="checkbox" class="custom-control-input" id="https-filter" checked>
                    <label class="custom-control-label" for="https-filter">HTTPS</label>
                </div>
                <div class="custom-control custom-checkbox">
                    <input type="checkbox" class="custom-control-input" id="ftp-filter" checked>
                    <label class="custom-control-label" for="ftp-filter">FTP</label>
                </div>
                
                <select id="country-filter" class="custom-select">
                    <option value="all" selected>All countries</option>
                    $COUNTRIES
                </select>
                <select id="state-filter" class="custom-select">
                    <option value="all" selected>All states</option>
                    <option value="up">Up to date</option>
                    <option value="part">Partially up to date</option>
                    <option value="out">Out of date</option>
                </select>
            </div>
        </div>
        <hr>
        <div id="states">
            <div class="state green"></div> Up to date
            <div class="state yellow"></div> Partially up to date
            <div class="state red"></div> Out of date
        </div>

        <table id="mirrors" class="table table-sm table-responsive-md">
            <thead>
                <tr>
                    <th>Mirror <span class="sort-arrow"></span></th>
                    <th>Country <span class="sort-arrow"></span></th>
                    <th>Protocol(s) <span class="sort-arrow"></span></th>
                    <th class="sorter-sync">Last sync (hh:mm) <span class="sort-arrow"></span></th>
                    <th class="sorter-branch">Stable <span class="sort-arrow"></span></th>
                    <th class="sorter-branch">Testing <span class="sort-arrow"></span></th>
                    <th class="sorter-branch">Unstable <span class="sort-arrow"></span></th>
                </tr>
            </thead>
            <tbody>
